plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.helloworld'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.helloworld"
        minSdkVersion 15
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ПОЛНОСТЬЮ УБИРАЕМ ВСЕ ЗАВИСИМОСТИ
    // Никаких implementation 'androidx.appcompat:appcompat...'
}